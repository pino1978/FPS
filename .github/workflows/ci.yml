name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fps
          POSTGRES_PASSWORD: fps
          POSTGRES_DB: fps
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U fps" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql://fps:fps@localhost:5432/fps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Apply versioned database migrations
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e-ui:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Critical and responsive E2E
        run: npm run e2e

  live-provider-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      LIVE_PROVIDER_SMOKE: '1'
      PREDICTION_AVAILABILITY_FIXTURE_LIMIT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Require provider secrets
        run: |
          test -n "$API_FOOTBALL_KEY"
          test -n "$FOOTBALL_DATA_TOKEN"
      - name: API-Football free smoke
        run: |
          code=$(curl -sS -o /tmp/af.json -w "%{http_code}" -H "x-apisports-key: $API_FOOTBALL_KEY" "https://v3.football.api-sports.io/status")
          test "$code" = "200"
          node -e "const x=require('/tmp/af.json'); if(x.errors && Object.keys(x.errors).length) process.exit(1); console.log('API-Football authenticated smoke: OK')"
      - name: football-data.org free smoke
        run: |
          code=$(curl -sS -o /tmp/fd.json -w "%{http_code}" -H "X-Auth-Token: $FOOTBALL_DATA_TOKEN" "https://api.football-data.org/v4/competitions/SA/standings")
          test "$code" = "200"
          node -e "const x=require('/tmp/fd.json'); if(!x.standings) process.exit(1); console.log('football-data authenticated smoke: OK')"
      - name: Generate Prisma client for API imports
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Build domain engines for live smoke
        run: npm run build -w @fps/domain && npm run build -w @fps/player-engine
      - name: Real Serie A adapter to prediction smoke
        run: npx vitest run apps/api/src/live-serie-a.smoke.test.ts --maxWorkers=1 --minWorkers=1
